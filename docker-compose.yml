name: apms_system

services:
  redis:
    container_name: apms_redis
    image: redis:7-alpine
    ports:
      # Host 6379 is taken by marketing_redis. API still uses redis:6379 internally.
      - "6382:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    container_name: apms_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pdm_telemetry
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-telemetry.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdm_telemetry"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    container_name: apms_api
    build: .
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
      - ./public:/app/public:ro
      - ./src:/app/src:ro
      - ./data:/app/data
    environment:
      # Docker DNS wins over .env localhost ports used by a host-run API.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DB_HOST: postgres
      DB_PORT: "5432"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pdm_telemetry
      CORS_ORIGINS: http://127.0.0.1:8004,http://localhost:8004,http://127.0.0.1:8000,http://localhost:8000,http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8004:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
